# 코드 스캐닝(CodeQL) — 셸/코드 인젝션, 취약 패턴을 자동 탐지.
# public 저장소라 무료. 결과는 Security → Code scanning alerts 에 쌓인다.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 한국시간 09:30 (UTC 00:30) — 새 규칙이 추가되면 옛 코드도 다시 본다
    - cron: "30 0 * * 1"

permissions:
  contents: read
  security-events: write   # 스캔 결과 업로드에 필요

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # actions = 워크플로 자체의 인젝션·권한 문제까지 검사한다
        language: [python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
