# 하루 1회 AI 한 줄 평 생성 (Gemini) — 리뷰 없는 할인 게임을 조금씩 채운다.
#
# 준비 (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   (수집 워크플로와 동일)
#   GEMINI_API_KEY                            (Google AI Studio 키)
#
# 수동 실행: Actions 탭 → "ai-reviews" → Run workflow (개수 조절 가능)

name: ai-reviews

on:
  schedule:
    # 매일 한국시간 04:40 (UTC 19:40) — 수집 이후 시간대
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번에 생성할 최대 개수"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests sentry-sdk
      - name: AI 리뷰 생성
        # 자유입력(limit)은 env 로 받아 숫자만 남겨 쓴다 (run: 직접 전개 = 명령 주입)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT_IN: ${{ github.event.inputs.limit || '120' }}
        run: |
          LIMIT="$(printf '%s' "$LIMIT_IN" | tr -cd '0-9')"
          python scripts/generate_ai_reviews.py --limit "${LIMIT:-120}" --sleep 5
