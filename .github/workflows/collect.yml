# 하루 2번(한국 시간 오전 9시 / 오후 9시) 자동으로 수집기를 실행한다.
#
# 사용 전 준비 (GitHub 저장소 → Settings → Secrets and variables → Actions):
#   SUPABASE_URL                = Supabase Project URL
#   SUPABASE_SERVICE_ROLE_KEY   = Supabase secret 키 (sb_secret_...)
#   VAPID_PRIVATE_KEY           = 웹 푸시 서명용 개인키 (웹의 공개키와 한 쌍)
#   VAPID_SUBJECT               = 연락처 (예: mailto:you@example.com)  ※ 선택
#
# 원본 보존 기한: RAW_RETENTION_DAYS (기본 45일). Storage 무료 한도가 1GB라
# 기한 없이 쌓으면 업로드가 실패하고 수집 자체가 망가진다.
#
# 수동 실행: GitHub 저장소 → Actions 탭 → "collect" → Run workflow

name: collect

on:
  schedule:
    # GitHub cron은 UTC 기준. 한국 시간 새벽 03:17 / 오후 15:17
    # (이용자가 적은 시간대 + 정각을 피해 부담 최소화)
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "수집할 플랫폼"
        required: false
        default: "all"
        type: choice
        options: [all, nintendo, playstation, xbox, steam, gear]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 같은 플랫폼 수집이 겹쳐서 두 번 돌지 않도록 방지
    # (수동 실행과 예약 실행이 겹치면 스토어에 2배 요청이 가는 것을 차단)
    concurrency:
      group: collect-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false        # 한 플랫폼이 실패해도 나머지는 계속
      matrix:
        platform: [nintendo, playstation, xbox, steam]
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      # 닌텐도는 봇 차단 우회를 위해 실제 크롬 브라우저가 필요할 수 있음
      - name: 크롬 브라우저 설치 (닌텐도 전용)
        if: matrix.platform == 'nintendo'
        run: python -m playwright install --with-deps chromium

      - name: 수집 실행
        if: github.event_name == 'schedule' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: python scripts/collect.py --platform ${{ matrix.platform }}

  # 수집이 모두 끝난 뒤 가격 알림을 보낸다.
  # 수집과 분리한 이유: 플랫폼별로 4개 잡이 병렬로 도는데, 각자 발송하면
  # 같은 사용자에게 알림이 네 번 갈 수 있다. 다 끝난 뒤 한 번만 보낸다.
  notify:
    needs: collect
    if: always()          # 일부 플랫폼이 실패해도 성공한 플랫폼 기준으로는 알려야 한다
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: notify
      cancel-in-progress: false
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 가격 알림 발송
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_URL: https://pakpick-web.vercel.app
        run: python scripts/notify.py

  # 주변기기(쿠팡 파트너스).
  # 정기 수집은 gear.yml 로 옮겼다 — 매시간 돈다. 게임 수집은 스토어 크롤링이라
  # 무거워서 하루 2번이 적당한데, 주변기기는 공식 API 라 가볍고 가격이 자주 바뀐다.
  # 여기 남겨 둔 건 수동 실행(platform=gear)용이다. schedule 로는 돌지 않는다 —
  # 그러면 정각 즈음에 두 워크플로가 같은 일을 두 번 하게 된다.
  gear:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'gear'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gear
      cancel-in-progress: false
    # 시크릿을 잡 단위 env 로 올린다. `if:` 조건에서는 secrets 컨텍스트를 쓸 수 없고
    # (워크플로 파싱 자체가 실패한다) env 컨텍스트는 쓸 수 있다.
    env:
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      # 키가 없으면 조용히 건너뛴다 — 주변기기 때문에 수집 전체가 빨간색이 되면 안 된다
      - name: 주변기기 수집
        if: env.COUPANG_ACCESS_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: python scripts/collect_gear.py

      - name: 키 없음 안내
        if: env.COUPANG_ACCESS_KEY == ''
        run: echo "COUPANG_ACCESS_KEY 가 없어 주변기기 수집을 건너뜁니다."

  # 오래된 원본 정리. 수집이 끝난 뒤 하루 한 번(새벽 실행에서만) 돈다.
  # 매 실행마다 돌 필요는 없고, Storage 한도에 닿기 전에 꾸준히 줄이는 게 목적이다.
  cleanup:
    needs: collect
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cleanup
      cancel-in-progress: false
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 오래된 원본 정리
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RAW_RETENTION_DAYS: "45"
        run: python scripts/cleanup.py
