# 하루 1회 IGDB 메타 보강 — 평점(평론가/이용자) + 플레이 타임.
#
# 준비 (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   (수집 워크플로와 동일)
#   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET    (dev.twitch.tv/console/apps 앱 등록)
#
# 수동 실행: Actions 탭 → "igdb" → Run workflow (개수 조절 가능)

name: igdb

on:
  schedule:
    # 매일 한국시간 04:10 (UTC 19:10) — 수집 이후, AI 리뷰(04:40) 이전
    # 하루 2회 (한국 04:10 / 16:10). 남은 카탈로그를 빨리 따라잡기 위함 —
    # 1회 200개로는 11,000개를 채우는 데 55일이 걸렸다.
    - cron: "10 19 * * *"
    - cron: "10 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번에 보강할 최대 개수"
        required: false
        default: "200"
      dry_run:
        description: "true 면 저장하지 않고 매칭 결과만 출력"
        required: false
        default: "false"
      ko_backfill:
        description: "true 면 기존 매칭분의 한국어 지원(ko_support)만 채움 (015 SQL 이후 일회성)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 600개면 IGDB 검색만 ~5분 + 응답 대기 (초당 3회 제한)
    concurrency:
      group: igdb
      cancel-in-progress: false
    # 키가 없으면 조용히 건너뛴다 — 보강 때문에 액션이 빨간색이 되면 안 된다
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests sentry-sdk
      - name: IGDB 보강
        if: env.TWITCH_CLIENT_ID != ''
        # 자유입력(limit)을 run: 에 직접 전개하면 셸 명령 주입이 된다.
        # env 로 받아 인용 참조하고, 숫자만 남긴다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LIMIT_IN: ${{ github.event.inputs.limit || '600' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          KO_BACKFILL: ${{ github.event.inputs.ko_backfill || 'false' }}
        run: |
          LIMIT="$(printf '%s' "$LIMIT_IN" | tr -cd '0-9')"
          LIMIT="${LIMIT:-600}"
          ARGS=(--limit "$LIMIT")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$KO_BACKFILL" = "true" ] && ARGS+=(--ko-backfill)
          python scripts/enrich_igdb.py "${ARGS[@]}"
      - name: 키 없음 안내
        if: env.TWITCH_CLIENT_ID == ''
        run: echo "TWITCH_CLIENT_ID 가 없어 IGDB 보강을 건너뜁니다."
