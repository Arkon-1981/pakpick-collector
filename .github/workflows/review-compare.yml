# AI 한 줄 평 모델 비교 테스트 (수동 실행 전용).
#
# 사용 전 준비: GitHub 저장소 → Settings → Secrets → Actions 에
#   ANTHROPIC_API_KEY = Anthropic API 키
#
# 실행: Actions 탭 → "review-compare" → Run workflow → 게임 제목 입력
name: review-compare

on:
  workflow_dispatch:
    inputs:
      title:
        description: "게임 제목 (예: 호그와트 레거시 Hogwarts Legacy)"
        required: true
        default: "호그와트 레거시 Hogwarts Legacy"
      platform:
        description: "플랫폼 표기"
        required: false
        default: "Nintendo Switch"

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install "anthropic>=0.40.0"

      - name: 모델 비교 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/compare_review_models.py \
            --title "${{ github.event.inputs.title }}" \
            --platform "${{ github.event.inputs.platform }}"
